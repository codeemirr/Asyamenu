button{cursor:pointer;background:none;border:none;font-family:inherit}

/* Header */
#header{position:sticky;top:0;z-index:20;border-bottom:1px solid #2a2520;background:linear-gradient(180deg,#0d0d0d 0%,rgba(13,13,13,0.97) 100%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

#lang-picker{display:flex;gap:4px;border-radius:9999px;border:1px solid #2a2520;background:#1a1a1a;padding:2px;flex-shrink:0;margin-left:12px}
.lang-btn{display:flex;align-items:center;gap:4px;border-radius:9999px;padding:4px 8px;font-size:11px;font-weight:700;transition:all .15s;color:#8a8278}
.lang-btn.active{background:#d4a853;color:#0d0d0d}
.lang-label{display:none}
@media(min-width:400px){.lang-label{display:inline}}

/* Category nav */
#cat-nav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 12px;scrollbar-width:none}
#cat-nav::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;border-radius:9999px;border:1px solid #2a2520;padding:6px 16px;font-size:11px;font-weight:500;white-space:nowrap;transition:all .2s;color:#8a8278;background:transparent}
.cat-pill.active{background:linear-gradient(135deg,#d4a853,#e8c97a);color:#0d0d0d;border-color:#d4a853;font-weight:600;box-shadow:0 2px 12px rgba(212,168,83,0.25)}

/* Main content */
#content{max-width:600px;margin:0 auto;padding:16px 16px 0}
.cat-section{margin-bottom:32px}
.cat-title{font-family:'Playfair Display',serif;font-size:1.15rem;color:#d4a853;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid #2a2520;display:flex;align-items:center;gap:8px}
.items-list{display:flex;flex-direction:column;gap:6px}

/* Item card */
.item-card{display:flex;align-items:flex-start;justify-content:space-between;background:#1a1a1a;border-radius:12px;padding:12px 14px;border:1px solid transparent;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.item-info{flex:1;min-width:0;padding-right:8px}
.item-name{font-size:13.5px;font-weight:500;color:#f0e6d3;line-height:1.35}
.item-desc{margin-top:2px;font-size:11.5px;color:#8a8278;line-height:1.4}
.item-price{margin-top:6px;font-family:'Playfair Display',serif;font-size:0.95rem;font-weight:700;color:#d4a853}

// ─── State ────────────────────────────────────────────────────────────────────
let currentLang = localStorage.getItem("qr_menu_lang") || "tr";

function t(obj, field) {
  return obj[field + "s"]?.[currentLang] || obj[field + "s"]?.["tr"] || "";
}

function fmt(price) {
  return "₺" + (price % 1 === 0 ? price.toFixed(0) : price.toFixed(2));
}

// ─── Render language picker ───────────────────────────────────────────────────
function renderLangPicker() {
  const el = document.getElementById("lang-picker");
  el.innerHTML = LANGUAGES.map(l => {
    const m = LANG_META[l];
    return `<button class="lang-btn${l === currentLang ? " active" : ""}" onclick="setLang('${l}')" title="${m.label}">
      <span>${m.flag}</span><span class="lang-label">${m.label}</span>
    </button>`;
  }).join("");
}

// ─── Render category nav ──────────────────────────────────────────────────────
function renderCatNav() {
  const el = document.getElementById("cat-nav");
  el.innerHTML = CATEGORIES.map(c => {
    const n = c.names[currentLang] || c.names.tr;
    const label = currentLang === "tr" ? n : `${n} (${c.names.tr})`;
    return `<button class="cat-pill" id="pill-${c.id}" onclick="scrollToCategory('${c.id}')">${label}</button>`;
  }).join("");
}

// ─── Render menu items ────────────────────────────────────────────────────────
function renderMenu() {
  const el = document.getElementById("content");
  const grouped = CATEGORIES.map(cat => ({
    cat,
    items: ITEMS.filter(i => i.cat === cat.id)
  })).filter(g => g.items.length > 0);

  el.innerHTML = grouped.map(({cat, items}, gi) => `
    <div class="cat-section" id="section-${cat.id}">
      <h2 class="cat-title">${currentLang === "tr" ? (cat.names.tr) : ((cat.names[currentLang] || cat.names.tr) + " (" + cat.names.tr + ")")}</h2>
      <div class="items-list">
        ${items.map((item, ii) => {
          const iName = item.names[currentLang] || item.names.tr;
          const iLabel = currentLang === "tr" ? iName : iName + " (" + item.names.tr + ")";
          const iDesc = item.descs[currentLang] || item.descs.tr;
          return "<div class='item-card' style='animation-delay:" + (((gi * 4 + ii) % 8) * 0.05) + "s'><div class='item-info'><p class='item-name'>" + iLabel + "</p>" + (iDesc ? "<p class='item-desc'>" + iDesc + "</p>" : "") + "<p class='item-price'>" + fmt(item.price) + "</p></div></div>";
        }).join("")}
      </div>
    </div>
  `).join("");
}

// ─── Active category tracking ─────────────────────────────────────────────────
let activecat = CATEGORIES[0].id;

function setActivePill(catId) {
  if (activecat === catId) return;
  activecat = catId;
  document.querySelectorAll(".cat-pill").forEach(el => el.classList.remove("active"));
  const pill = document.getElementById("pill-" + catId);
  if (pill) {
    pill.classList.add("active");
    pill.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
  }
}

const headerH = 120;
function scrollToCategory(catId) {
  const el = document.getElementById("section-" + catId);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.pageYOffset - headerH - 8;
  window.scrollTo({top, behavior:"smooth"});
}

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const id = e.target.id.replace("section-","");
      setActivePill(id);
    }
  });
}, {rootMargin:`-${headerH + 8}px 0px -55% 0px`, threshold:0});

function observeSections() {
  document.querySelectorAll(".cat-section").forEach(el => observer.observe(el));
}

// ─── Language switch ──────────────────────────────────────────────────────────
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("qr_menu_lang", lang);
  renderLangPicker();
  renderCatNav();
  renderMenu();
  observeSections();
  document.documentElement.lang = lang;
}

// ─── Init ─────────────────────────────────────────────────────────────────────
renderLangPicker();
renderCatNav();
renderMenu();
observeSections();
document.getElementById("pill-" + CATEGORIES[0].id)?.classList.add("active");
</script>
